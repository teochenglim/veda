name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

env:
  GO_VERSION: '1.27'

jobs:
  # ── gate: tests must pass before anything ships ────────────────────────────

  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go vet ./...
      - run: go test ./... -race -cover

  # ── binary matrix ───────────────────────────────────────────────────────────
  #
  # CGO_ENABLED=0 throughout: SQLite via modernc.org/sqlite is pure Go, so
  # every OS/arch combination is a plain cross-compile with no C toolchain.
  # Artifact per matrix cell: veda-<tag>-<goos>-<goarch>.tar.gz (.zip on windows)

  build:
    name: Build — ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          mkdir -p dist/build
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o dist/build/veda${EXT} ./cmd/veda

      - name: Package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [ "$GOOS" = "windows" ]; then
            ARCHIVE="veda-${VERSION}-${GOOS}-${GOARCH}.zip"
            (cd dist/build && zip -r "../../${ARCHIVE}" .)
          else
            ARCHIVE="veda-${VERSION}-${GOOS}-${GOARCH}.tar.gz"
            tar -czf "${ARCHIVE}" -C dist/build .
          fi
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ARCHIVE }}
          retention-days: 1

  # ── GitHub Release: collect all archives, attach to release ────────────────

  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-*
          merge-multiple: true
          path: dist/

      - name: Generate SHA256SUMS
        run: (cd dist && sha256sum -- * > SHA256SUMS)

      - name: Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*

  # ── smoke: install.sh on clean runners (v0.8.0 AC2) ─────────────────────────

  smoke-install:
    name: Smoke install.sh — ${{ matrix.os }}
    needs: create-release
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install and verify
        env:
          VEDA_VERSION: ${{ github.ref_name }}
        run: |
          sh ./install.sh --dir "$HOME/.local/bin"
          [ "$("$HOME/.local/bin/veda" version)" = "veda $VEDA_VERSION" ]

  # ── smoke: Homebrew tap (v0.8.0 AC1) — enabled once the tap repo exists ─────
  # Set the HOMEBREW_TAP repo variable (e.g. teochenglim/homebrew-veda) and run
  # `make packaging VERSION=x.y.z` to publish the formula for each release.

  smoke-brew:
    name: Smoke brew install
    needs: create-release
    if: vars.HOMEBREW_TAP != ''
    runs-on: macos-latest
    steps:
      - name: Install from tap and verify
        env:
          HOMEBREW_TAP: ${{ vars.HOMEBREW_TAP }}
          VEDA_VERSION: ${{ github.ref_name }}
        run: |
          brew tap "$HOMEBREW_TAP"
          brew install "$HOMEBREW_TAP/veda"
          [ "$(veda version)" = "veda $VEDA_VERSION" ]
